<!DOCTYPE html>
<html lang="en" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TheHomoSapiens | Login</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#20263f">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        navy: '#20263f',
                        mint: '#7ae2d5',
                        darkCard: '#151F32',
                        darkInput: '#1E293B',
                        neonTeal: '#2DD4BF',
                        appDark: '#0B1120'
                    }
                }
            }
        }
    </script>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Poppins', sans-serif; }
        .login-input-shadow { box-shadow: 0px 10px 20px -5px rgba(0,0,0,0.12); }
        .glow-mint { box-shadow: 0 0 35px -5px rgba(122, 226, 213, 0.35); }
    </style>
</head>
<body class="bg-navy min-h-screen flex flex-col justify-between selection:bg-mint selection:text-navy relative overflow-x-hidden antialiased">

    <!-- Ambient Glow Background Blobs -->
    <div class="absolute -top-32 -left-32 w-96 h-96 bg-mint/15 rounded-full blur-3xl pointer-events-none"></div>
    <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-teal-500/15 rounded-full blur-3xl pointer-events-none"></div>

    <!-- Notification Toast Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2.5 max-w-sm pointer-events-none"></div>

    <!-- Header Brand Banner -->
    <header class="w-full px-6 py-5 flex items-center justify-between z-10">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-mint to-teal-400 text-navy flex items-center justify-center font-black text-xl shadow-lg glow-mint">
                <i class="fa-solid fa-hands-asl-interpreting"></i>
            </div>
            <div>
                <span class="font-extrabold text-lg md:text-xl text-white tracking-tight block leading-tight">TheHomoSapiens</span>
                <span class="text-[10px] font-bold text-mint uppercase tracking-wider">SIH 2026 AI Innovation</span>
            </div>
        </div>
        <div class="text-xs text-slate-300 font-semibold hidden sm:flex items-center gap-2">
            <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
            <span>AI Recognition Engine Online</span>
        </div>
    </header>

    <!-- Main Login Card Container -->
    <main class="flex-grow flex flex-col items-center justify-center px-4 py-8 z-10">
        <div class="w-full max-w-[430px]">
            
            <!-- Mint Login Card -->
            <div class="bg-mint rounded-[2.5rem] p-8 md:p-10 shadow-2xl relative transition-transform">
                <div class="text-center mb-7">
                    <span class="inline-block px-3 py-1 rounded-full bg-navy/10 text-navy text-[11px] font-black uppercase tracking-wider mb-2">
                        Member Access
                    </span>
                    <h1 class="text-2xl md:text-3xl font-black text-navy leading-tight tracking-tight">
                        LOGIN TO YOUR<br>ACCOUNT
                    </h1>
                </div>

                <form id="login-form" onsubmit="handleLoginSubmit(event)" class="space-y-4">
                    <!-- Email / Mobile Input -->
                    <div>
                        <label class="block text-navy font-bold mb-1.5 pl-2 text-xs uppercase tracking-wider">Email or Mobile Number</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <i class="fa-solid fa-user text-sm"></i>
                            </span>
                            <input type="text" id="login-identifier" required placeholder="name@example.com or mobile"
                                class="w-full h-12 pl-11 pr-4 rounded-full border-none text-slate-800 bg-white login-input-shadow focus:outline-none focus:ring-2 focus:ring-navy/40 font-semibold text-sm transition">
                        </div>
                    </div>

                    <!-- Password Input -->
                    <div>
                        <label class="block text-navy font-bold mb-1.5 pl-2 text-xs uppercase tracking-wider">Password</label>
                        <div class="relative">
                            <span class="absolute inset-y-0 left-0 pl-4 flex items-center text-slate-400">
                                <i class="fa-solid fa-lock text-sm"></i>
                            </span>
                            <input type="password" id="login-password" required placeholder="••••••••••••"
                                class="w-full h-12 pl-11 pr-12 rounded-full border-none text-slate-800 bg-white login-input-shadow focus:outline-none focus:ring-2 focus:ring-navy/40 font-semibold text-sm transition">
                            <button type="button" onclick="togglePasswordVisibility('login-password', this)" class="absolute right-4 inset-y-0 flex items-center text-slate-400 hover:text-navy">
                                <i class="fa-solid fa-eye text-sm"></i>
                            </button>
                        </div>
                    </div>

                    <!-- Remember Me & Forgot Password -->
                    <div class="flex items-center justify-between text-xs text-navy font-semibold px-2 pt-1">
                        <label class="flex items-center gap-1.5 cursor-pointer">
                            <input type="checkbox" id="remember-me" checked class="rounded border-navy text-navy focus:ring-0">
                            <span>Remember me</span>
                        </label>
                        <button type="button" onclick="openResetModal()" class="hover:underline font-bold">Reset Password?</button>
                    </div>

                    <!-- Submit Button -->
                    <button type="submit" id="btn-login-submit"
                        class="w-full mt-4 bg-navy hover:bg-slate-900 text-mint hover:text-white font-black text-base py-3.5 px-8 rounded-full shadow-xl hover:shadow-2xl transition duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-right-to-bracket text-sm"></i>
                        <span>SIGN IN</span>
                    </button>
                </form>
            </div>

            <!-- Bottom Navigation Link to Register -->
            <div class="w-full flex justify-between items-center mt-6 px-4">
                <div class="text-white text-xs md:text-sm font-normal">
                    Don't have an account?
                </div>
                <a href="register.html" class="inline-flex items-center gap-1.5 text-mint hover:text-white font-extrabold text-xs md:text-sm uppercase tracking-wider bg-white/10 hover:bg-white/15 px-4 py-2 rounded-full border border-mint/30 transition">
                    <span>Create Account</span>
                    <i class="fa-solid fa-arrow-right text-[11px]"></i>
                </a>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="w-full text-center py-4 text-slate-400 text-xs font-medium z-10 border-t border-slate-800/80">
        Team TheHomoSapiens | SIH 2026 &bull; Developed by <a href="https://www.linkedin.com/in/sayan-chakraborty-282203379/" target="_blank" class="text-mint hover:underline font-bold">Sayan Chakraborty</a>
    </footer>

    <!-- Password Reset Modal -->
    <div id="modal-reset-pwd" class="hidden fixed inset-0 bg-slate-950/80 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-darkCard border border-slate-700 rounded-3xl w-full max-w-sm p-6 shadow-2xl relative text-white">
            <button onclick="closeResetModal()" class="absolute top-4 right-4 text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            <div class="w-10 h-10 rounded-xl bg-mint/20 text-mint flex items-center justify-center font-bold text-lg mb-3">
                <i class="fa-solid fa-key"></i>
            </div>
            <h3 class="font-black text-lg text-white mb-1">Reset Password</h3>
            <p class="text-xs text-slate-400 mb-4">Enter your registered email or mobile to set a new password.</p>
            <form onsubmit="handleResetPasswordSubmit(event)" class="space-y-3">
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">Registered ID</label>
                    <input type="text" id="reset-id" required placeholder="Email or Mobile" class="w-full px-3 py-2 bg-darkInput border border-slate-700 rounded-xl text-xs font-semibold text-white outline-none focus:border-mint transition">
                </div>
                <div>
                    <label class="block text-[11px] font-bold text-slate-400 uppercase mb-1">New Password</label>
                    <input type="password" id="reset-pwd" required placeholder="New password" class="w-full px-3 py-2 bg-darkInput border border-slate-700 rounded-xl text-xs font-semibold text-white outline-none focus:border-mint transition">
                </div>
                <button type="submit" id="btn-reset-submit" class="w-full mt-2 py-2.5 bg-mint hover:bg-teal-300 text-navy font-black text-xs rounded-xl shadow-md transition">Reset & Save</button>
            </form>
        </div>
    </div>

    <!-- Login Application Logic -->
    <script>
        // Resolve API Base (Local 8000 or Render Cloud)
        function resolveApiBase() {
            if (window.location.hostname === "localhost" || window.location.hostname === "127.0.0.1") {
                return "http://localhost:8000/api";
            }
            return "https://thehomosapiens-sih2026.onrender.com/api";
        }
        const API_BASE = resolveApiBase();

        // Notification Toast
        function showToast(message, type = "info") {
            const container = document.getElementById("toast-container");
            const toast = document.createElement("div");
            const icons = {
                success: "fa-solid fa-circle-check text-emerald-400",
                error: "fa-solid fa-circle-xmark text-rose-400",
                warning: "fa-solid fa-triangle-exclamation text-amber-400",
                info: "fa-solid fa-circle-info text-mint"
            };
            toast.className = `p-3.5 rounded-2xl bg-slate-900/95 text-white border border-slate-700 shadow-2xl flex items-center gap-3 text-xs font-bold pointer-events-auto transform translate-y-2 opacity-0 transition duration-300`;
            toast.innerHTML = `<i class="${icons[type] || icons.info} text-base flex-shrink-0"></i> <span>${message}</span>`;
            container.appendChild(toast);

            setTimeout(() => toast.classList.remove("translate-y-2", "opacity-0"), 10);
            setTimeout(() => {
                toast.classList.add("opacity-0", "translate-y-2");
                setTimeout(() => toast.remove(), 300);
            }, 3500);
        }

        function togglePasswordVisibility(id, btn) {
            const el = document.getElementById(id);
            if (el.type === 'password') {
                el.type = 'text';
                btn.innerHTML = '<i class="fa-solid fa-eye-slash text-sm"></i>';
            } else {
                el.type = 'password';
                btn.innerHTML = '<i class="fa-solid fa-eye text-sm"></i>';
            }
        }

        // Direct Login Submission Handler
        async function handleLoginSubmit(e) {
            e.preventDefault();
            const id = document.getElementById("login-identifier").value.trim();
            const pwd = document.getElementById("login-password").value;
            const btn = document.getElementById("btn-login-submit");
            const originalHtml = btn.innerHTML;

            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> <span>AUTHENTICATING...</span>`;
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/login`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ identifier: id, password: pwd })
                });

                const d = await res.json();

                if (res.ok) {
                    showToast(`Welcome back, ${d.name}!`, "success");

                    // DIRECT REDIRECTION:
                    // If credentials belong to superadmin, admin, or manager -> DIRECT TO ADMIN PANEL WITH ZERO EXTRA LAYER!
                    const isAdmin = d.role === "superadmin" || d.role === "admin" || d.role === "manager" || d.redirect_url === "admin.html";
                    if (isAdmin) {
                        // Admin user: Store in sessionStorage ONLY so Admin must log in every time the site is opened fresh
                        // Never persist Admin session in permanent localStorage
                        localStorage.removeItem("ths_token");
                        localStorage.removeItem("ths_uid");
                        localStorage.removeItem("ths_name");
                        localStorage.removeItem("ths_email");
                        localStorage.removeItem("ths_role");
                        localStorage.removeItem("ths_admin_token");
                        localStorage.removeItem("ths_admin_name");
                        localStorage.removeItem("ths_admin_email");
                        localStorage.removeItem("ths_admin_role");
                        localStorage.removeItem("ths_admin_pfp");

                        sessionStorage.setItem("ths_admin_token", d.token);
                        sessionStorage.setItem("ths_admin_name", d.name);
                        sessionStorage.setItem("ths_admin_email", d.email);
                        sessionStorage.setItem("ths_admin_role", d.role);
                        sessionStorage.setItem("ths_admin_pfp", d.profile_picture || "");
                        
                        setTimeout(() => {
                            window.location.href = "admin.html";
                        }, 250);
                    } else {
                        // Normal user: Save in localStorage so normal user stays logged in
                        localStorage.setItem("ths_token", d.token);
                        localStorage.setItem("ths_uid", d.unique_id);
                        localStorage.setItem("ths_name", d.name);
                        localStorage.setItem("ths_email", d.email);
                        localStorage.setItem("ths_dob", d.dob || "");
                        localStorage.setItem("ths_mobile", d.mobile || "");
                        localStorage.setItem("ths_role", d.role || "user");
                        localStorage.setItem("ths_pfp", d.profile_picture || "");

                        // Clear any admin keys
                        sessionStorage.clear();
                        localStorage.removeItem("ths_admin_token");
                        localStorage.removeItem("ths_admin_role");

                        setTimeout(() => {
                            window.location.href = "index.html";
                        }, 250);
                    }
                } else {
                    showToast(d.detail || "Invalid login credentials. Please try again.", "error");
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }
            } catch (err) {
                console.warn("Backend connectivity issue", err);
                // Emergency evaluation fallback for super admin credentials if network drops
                if (id === "sayan@superadmin.com" && pwd === "SuperAdmin@123") {
                    localStorage.removeItem("ths_admin_token");
                    localStorage.removeItem("ths_token");
                    localStorage.removeItem("ths_role");
                    sessionStorage.setItem("ths_admin_token", "demo_admin_token_sih2026");
                    sessionStorage.setItem("ths_admin_name", "Sayan Chakraborty (Super Admin)");
                    sessionStorage.setItem("ths_admin_email", id);
                    sessionStorage.setItem("ths_admin_role", "superadmin");
                    showToast("Admin Mode Unlocked", "info");
                    setTimeout(() => { window.location.href = "admin.html"; }, 300);
                } else if (id === "sayan2008c@gmail.com" && pwd === "Sayan123") {
                    localStorage.setItem("ths_token", "demo_user_token_sih2026");
                    localStorage.setItem("ths_name", "Sayan Chakraborty");
                    localStorage.setItem("ths_email", id);
                    localStorage.setItem("ths_role", "user");
                    showToast("User Portal Unlocked", "info");
                    setTimeout(() => { window.location.href = "index.html"; }, 300);
                } else {
                    showToast("Could not reach API server. Please verify backend status.", "error");
                    btn.innerHTML = originalHtml;
                    btn.disabled = false;
                }
            }
        }

        // Reset Password Handlers
        function openResetModal() {
            document.getElementById("modal-reset-pwd").classList.remove("hidden");
            const entered = document.getElementById("login-identifier").value.trim();
            if (entered) document.getElementById("reset-id").value = entered;
        }

        function closeResetModal() {
            document.getElementById("modal-reset-pwd").classList.add("hidden");
        }

        async function handleResetPasswordSubmit(e) {
            e.preventDefault();
            const id = document.getElementById("reset-id").value.trim();
            const pwd = document.getElementById("reset-pwd").value;
            const btn = document.getElementById("btn-reset-submit");
            const orig = btn.innerText;

            btn.innerText = "Saving...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_BASE}/reset_password`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ identifier: id, new_password: pwd })
                });
                const d = await res.json();
                if (res.ok) {
                    showToast(d.message || "Password updated successfully!", "success");
                    closeResetModal();
                } else {
                    showToast(d.detail || "Password update failed.", "error");
                }
            } catch (err) {
                showToast("Server error resetting password.", "error");
            } finally {
                btn.innerText = orig;
                btn.disabled = false;
            }
        }

        // On Page Load:
        // 1. Admin MUST log in every time! Wipe any lingering admin keys from storage.
        // 2. Normal users stay logged in (redirect to index.html).
        window.addEventListener("DOMContentLoaded", () => {
            localStorage.removeItem("ths_admin_token");
            localStorage.removeItem("ths_admin_name");
            localStorage.removeItem("ths_admin_email");
            localStorage.removeItem("ths_admin_role");
            localStorage.removeItem("ths_admin_pfp");
            sessionStorage.removeItem("ths_admin_token");
            sessionStorage.removeItem("ths_admin_name");
            sessionStorage.removeItem("ths_admin_email");
            sessionStorage.removeItem("ths_admin_role");
            sessionStorage.removeItem("ths_admin_pfp");

            const token = localStorage.getItem("ths_token");
            const role = localStorage.getItem("ths_role");
            if (token && role === "user") {
                // Normal user has valid persistent session
                window.location.replace("index.html");
            }
        });
    </script>
</body>
</html>
