<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Homo Sapiens - SIH 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .tab-active { background-color: #0f172a; color: white; border: 1px solid #0f172a; }
        .tab-inactive { background-color: white; color: #64748b; border: 1px solid #e2e8f0; }
    </style>
</head>
<body class="min-h-screen bg-slate-50 text-slate-800 flex flex-col font-sans selection:bg-teal-200">
    
    <!-- Navbar -->
    <nav class="sticky top-0 z-50 bg-white border-b border-slate-200 p-4 flex justify-between items-center shadow-sm">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-teal-600 rounded flex items-center justify-center text-white text-xl">🤟</div>
            <div class="font-bold text-xl tracking-tight text-slate-900 cursor-pointer" onclick="showDashboard()">
                TheHomoSapiens <span class="text-teal-600 font-medium ml-1">| SIH 2026</span>
            </div>
        </div>
        <div id="nav-user-controls" class="hidden items-center gap-4">
            <div class="flex items-center gap-2 bg-slate-100 px-3 py-1.5 rounded-full border border-slate-200 hidden md:flex">
                <span id="connection-dot" class="w-2.5 h-2.5 rounded-full bg-red-500"></span>
                <span id="connection-status" class="text-xs font-bold text-slate-600 uppercase tracking-wider">Offline</span>
            </div>
            
            <!-- User Dropdown Menu -->
            <div class="relative inline-block text-left">
                <button onclick="toggleDropdown()" class="flex items-center gap-2 font-medium text-slate-700 hover:text-teal-600 focus:outline-none transition-colors">
                    <span id="user-greeting"></span>
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                </button>
                <div id="dropdown-menu" class="hidden absolute right-0 mt-2 w-48 bg-white border border-slate-200 rounded-lg shadow-lg py-1 z-50">
                    <button onclick="openProfileSettings()" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-teal-600 flex items-center gap-2">
                        ⚙️ Profile Settings
                    </button>
                    <button onclick="openChangePassword()" class="w-full text-left px-4 py-2 text-sm text-slate-700 hover:bg-slate-50 hover:text-teal-600 flex items-center gap-2">
                        🔐 Change Password
                    </button>
                    <hr class="my-1 border-slate-100">
                    <button onclick="logout()" class="w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 font-medium flex items-center gap-2">
                        🚪 Logout
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ========================================== -->
    <!-- AUTHENTICATION VIEW                        -->
    <!-- ========================================== -->
    <div id="view-auth" class="flex-grow flex items-center justify-center p-4">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-md">
            
            <!-- Login Form -->
            <div id="form-login">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Welcome Back</h2>
                <form onsubmit="handleLogin(event)" class="flex flex-col gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Email or Mobile Number</label>
                        <input type="text" id="login-identifier" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
                        <div class="relative">
                            <input type="password" id="login-password" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 pr-10 outline-none focus:border-teal-500 focus:ring-1 focus:ring-teal-500">
                            <button type="button" onclick="togglePasswordVisibility('login-password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-teal-600">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="mt-2 w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg shadow-sm transition-colors">Sign In</button>
                </form>
                <p class="text-center text-sm text-slate-600 mt-6">
                    Don't have an account? <button onclick="toggleAuthMode()" class="text-teal-600 font-bold hover:underline">Create one</button>
                </p>
            </div>

            <!-- Register Form -->
            <div id="form-register" class="hidden">
                <h2 class="text-2xl font-bold text-slate-900 mb-6">Create Account</h2>
                <form onsubmit="handleRegistration(event)" class="flex flex-col gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Full Name</label>
                        <input type="text" id="reg-name" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 outline-none focus:border-teal-500">
                    </div>
                    <div class="flex gap-3">
                        <div class="w-1/3">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Age</label>
                            <input type="number" id="reg-age" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 outline-none focus:border-teal-500">
                        </div>
                        <div class="w-2/3">
                            <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Mobile</label>
                            <input type="tel" id="reg-mobile" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 outline-none focus:border-teal-500">
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Email</label>
                        <input type="email" id="reg-email" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 outline-none focus:border-teal-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Password</label>
                        <div class="relative">
                            <input type="password" id="reg-password" required minlength="6" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 pr-10 outline-none focus:border-teal-500">
                            <button type="button" onclick="togglePasswordVisibility('reg-password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-teal-600">👁️</button>
                        </div>
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-1">Confirm Password</label>
                        <div class="relative">
                            <input type="password" id="reg-confirm" required minlength="6" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 pr-10 outline-none focus:border-teal-500">
                            <button type="button" onclick="togglePasswordVisibility('reg-confirm')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-teal-600">👁️</button>
                        </div>
                    </div>
                    <button type="submit" class="mt-4 w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-lg shadow-sm transition-colors">Register</button>
                </form>
                <p class="text-center text-sm text-slate-600 mt-6">
                    Already have an account? <button onclick="toggleAuthMode()" class="text-teal-600 font-bold hover:underline">Sign in</button>
                </p>
            </div>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- PROFILE SETTINGS VIEW                      -->
    <!-- ========================================== -->
    <div id="view-profile" class="hidden flex-grow items-center justify-center p-4 w-full">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-lg">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Profile Settings</h2>
                <button onclick="showDashboard()" class="text-sm font-bold text-teal-600 hover:underline">← Back</button>
            </div>
            
            <form onsubmit="handleProfileUpdate(event)" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Full Name</label>
                    <input type="text" id="prof-name" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 outline-none focus:border-teal-500">
                </div>
                <div class="flex gap-3">
                    <div class="w-1/3">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Age</label>
                        <input type="number" id="prof-age" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 outline-none focus:border-teal-500">
                    </div>
                    <div class="w-2/3">
                        <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Mobile Number</label>
                        <input type="tel" id="prof-mobile" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 outline-none focus:border-teal-500">
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Email Address</label>
                    <input type="email" id="prof-email" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 outline-none focus:border-teal-500">
                </div>
                
                <hr class="my-2 border-slate-200">
                
                <div class="bg-red-50 border border-red-100 p-4 rounded-lg">
                    <label class="block text-xs font-bold text-red-700 uppercase mb-1">Current Password (Required to save)</label>
                    <div class="relative">
                        <input type="password" id="prof-password" required class="w-full bg-white border border-red-200 rounded-lg p-2.5 pr-10 outline-none focus:border-red-500 focus:ring-1 focus:ring-red-500">
                        <button type="button" onclick="togglePasswordVisibility('prof-password')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-red-600">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="mt-2 w-full bg-teal-600 hover:bg-teal-700 text-white font-bold py-3 rounded-lg shadow-sm transition-colors">Verify & Save Changes</button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- CHANGE PASSWORD VIEW                       -->
    <!-- ========================================== -->
    <div id="view-change-password" class="hidden flex-grow items-center justify-center p-4 w-full">
        <div class="bg-white p-8 rounded-xl shadow-sm border border-slate-200 w-full max-w-md">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-2xl font-bold text-slate-900">Change Password</h2>
                <button onclick="showDashboard()" class="text-sm font-bold text-teal-600 hover:underline">← Back</button>
            </div>
            
            <form onsubmit="handleChangePassword(event)" class="flex flex-col gap-4">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Current Password</label>
                    <div class="relative">
                        <input type="password" id="change-current-pw" required class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 pr-10 outline-none focus:border-teal-500">
                        <button type="button" onclick="togglePasswordVisibility('change-current-pw')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-teal-600">👁️</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">New Password</label>
                    <div class="relative">
                        <input type="password" id="change-new-pw" required minlength="6" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 pr-10 outline-none focus:border-teal-500">
                        <button type="button" onclick="togglePasswordVisibility('change-new-pw')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-teal-600">👁️</button>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase mb-1">Confirm New Password</label>
                    <div class="relative">
                        <input type="password" id="change-confirm-pw" required minlength="6" class="w-full bg-slate-50 border border-slate-300 rounded-lg p-2.5 pr-10 outline-none focus:border-teal-500">
                        <button type="button" onclick="togglePasswordVisibility('change-confirm-pw')" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-teal-600">👁️</button>
                    </div>
                </div>
                
                <button type="submit" class="mt-4 w-full bg-slate-900 hover:bg-slate-800 text-white font-bold py-3 rounded-lg shadow-sm transition-colors">Update Password</button>
            </form>
        </div>
    </div>

    <!-- ========================================== -->
    <!-- MAIN WORKSPACE (Hidden until login)        -->
    <!-- ========================================== -->
    <main id="view-workspace" class="hidden flex-grow flex-col items-center p-4 md:p-8 max-w-7xl mx-auto w-full gap-6">
        
        <div class="flex w-full max-w-md mx-auto gap-2">
            <button id="tab-sign-to-text" onclick="switchMode('sign-to-text')" class="flex-1 px-4 py-3 rounded-lg font-bold transition-all flex items-center justify-center gap-2 tab-active">
                📷 Sign → Text
            </button>
            <button id="tab-text-to-sign" onclick="switchMode('text-to-sign')" class="flex-1 px-4 py-3 rounded-lg font-bold transition-all flex items-center justify-center gap-2 tab-inactive hover:bg-slate-50">
                🎙️ Text → Sign
            </button>
        </div>

        <div id="mode-sign-to-text" class="flex flex-col lg:flex-row gap-6 w-full">
            <div class="flex-1 flex flex-col gap-6">
                <div class="relative bg-black rounded-xl overflow-hidden aspect-video shadow-md border border-slate-200">
                    <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
                    <canvas id="overlay" class="absolute inset-0 w-full h-full z-10 transform scale-x-[-1] pointer-events-none object-cover"></canvas>
                </div>

                <div class="bg-white border border-slate-200 p-6 rounded-xl shadow-sm relative">
                    <div class="flex justify-between items-center mb-4">
                        <h3 class="text-xs text-slate-500 font-bold uppercase tracking-widest">Live Translation</h3>
                        <button onclick="saveConversation()" class="bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold py-1.5 px-3 rounded border border-slate-300 transition-colors">
                            💾 Save to History
                        </button>
                    </div>
                    <div class="min-h-[60px] flex items-center">
                        <p id="translated-text" class="text-3xl font-bold text-slate-900">Waiting for camera...</p>
                    </div>
                    <div class="mt-6 flex gap-3 border-t border-slate-100 pt-4">
                        <button id="btn-auto-speak" onclick="toggleAutoSpeak()" class="flex-1 bg-white hover:bg-slate-50 text-slate-700 border border-slate-300 py-2 rounded-lg font-medium transition-all text-sm">
                            <span id="auto-speak-text">🔇 Auto-Speak: OFF</span>
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-full lg:w-80 flex flex-col gap-4">
                <div class="bg-white border border-slate-200 rounded-xl p-6 shadow-sm h-full flex flex-col max-h-[500px] lg:max-h-full">
                    <h3 class="text-sm text-slate-900 font-bold uppercase tracking-wider mb-4 border-b border-slate-100 pb-2">🗂️ Saved Conversations</h3>
                    <div id="history-list" class="flex-1 overflow-y-auto pr-2 flex flex-col gap-3 custom-scrollbar"></div>
                </div>
            </div>
        </div>

        <div id="mode-text-to-sign" class="hidden flex-col gap-6 w-full max-w-4xl">
            <div class="bg-white border border-slate-200 p-6 rounded-xl shadow-sm flex flex-col md:flex-row gap-4">
                <div class="flex-grow">
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Input Text or Speech</label>
                    <div class="relative w-full">
                        <input type="text" id="input-text-sign" placeholder="Type here..." class="w-full bg-slate-50 border border-slate-300 rounded-lg p-3 pr-12 outline-none focus:border-teal-500">
                    </div>
                </div>
                <div class="flex items-end">
                    <button onclick="simulateAvatarTranslation()" class="w-full md:w-auto bg-slate-900 hover:bg-slate-800 text-white px-8 py-3 rounded-lg font-bold transition-colors">
                        Translate
                    </button>
                </div>
            </div>
            
            <div class="bg-slate-100 border border-slate-200 rounded-xl aspect-video md:aspect-[21/9] flex flex-col items-center justify-center shadow-inner relative overflow-hidden">
                <div id="avatar-status" class="text-center z-10 w-full px-6">
                    <span class="text-7xl block mb-4">🧍‍♂️</span>
                    <h2 class="text-xl font-bold text-slate-700">Avatar Engine Ready</h2>
                </div>
            </div>
        </div>
    </main>

    <script>
        const API_BASE_URL = "http://localhost:8000/api";
        const RENDER_URL = "ws://localhost:8000/ws/translate"; 

        // ==========================================
        // UI HELPERS & VIEW ROUTING
        // ==========================================
        function hideAllViews() {
            const views = ['view-auth', 'view-workspace', 'view-profile', 'view-change-password'];
            views.forEach(id => {
                document.getElementById(id).classList.add('hidden');
                document.getElementById(id).classList.remove('flex');
            });
            document.getElementById('dropdown-menu').classList.add('hidden');
        }

        function togglePasswordVisibility(fieldId) {
            const field = document.getElementById(fieldId);
            field.type = field.type === "password" ? "text" : "password";
        }

        function toggleDropdown() {
            document.getElementById('dropdown-menu').classList.toggle('hidden');
        }

        // Close dropdown if clicked outside
        window.onclick = function(event) {
            if (!event.target.closest('.relative')) {
                const dropdowns = document.getElementById("dropdown-menu");
                if (dropdowns && !dropdowns.classList.contains('hidden')) {
                    dropdowns.classList.add('hidden');
                }
            }
        }

        function toggleAuthMode() {
            document.getElementById('form-login').classList.toggle('hidden');
            document.getElementById('form-register').classList.toggle('hidden');
        }

        // ==========================================
        // AUTHENTICATION & PROFILES
        // ==========================================
        async function handleRegistration(e) {
            e.preventDefault();
            const password = document.getElementById('reg-password').value;
            const confirm = document.getElementById('reg-confirm').value;

            if (password !== confirm) {
                return alert("Passwords do not match. Please ensure both fields are identical.");
            }

            const payload = {
                name: document.getElementById('reg-name').value,
                age: parseInt(document.getElementById('reg-age').value),
                mobile: document.getElementById('reg-mobile').value,
                email: document.getElementById('reg-email').value,
                password: password
            };

            try {
                const response = await fetch(`${API_BASE_URL}/register`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert("Registration successful! Please login.");
                    toggleAuthMode();
                } else {
                    alert("Error: " + data.detail);
                }
            } catch (error) {
                alert("Server connection failed.");
            }
        }

        async function handleLogin(e) {
            e.preventDefault();
            const payload = {
                identifier: document.getElementById('login-identifier').value,
                password: document.getElementById('login-password').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (response.ok) {
                    localStorage.setItem('userEmail', data.email);
                    localStorage.setItem('userName', data.name);
                    showDashboard();
                } else {
                    alert("Login Failed: " + data.detail);
                }
            } catch (error) {
                alert("Server connection failed.");
            }
        }

        function showDashboard() {
            hideAllViews();
            document.getElementById('view-workspace').classList.remove('hidden');
            document.getElementById('view-workspace').classList.add('flex');
            
            document.getElementById('nav-user-controls').classList.remove('hidden');
            document.getElementById('nav-user-controls').classList.add('flex');
            
            // Format name in CAPS
            const nameCaps = (localStorage.getItem('userName') || "").toUpperCase();
            document.getElementById('user-greeting').innerText = `WELCOME, ${nameCaps}`;
            
            loadHistory();
            startCamera(); 
        }

        async function openProfileSettings() {
            hideAllViews();
            document.getElementById('view-profile').classList.remove('hidden');
            document.getElementById('view-profile').classList.add('flex');

            try {
                const response = await fetch(`${API_BASE_URL}/user/${localStorage.getItem('userEmail')}`);
                if (response.ok) {
                    const data = await response.json();
                    document.getElementById('prof-name').value = data.name;
                    document.getElementById('prof-age').value = data.age;
                    document.getElementById('prof-mobile').value = data.mobile;
                    document.getElementById('prof-email').value = data.email;
                }
            } catch (error) {
                console.error("Could not fetch user details.");
            }
        }

        async function handleProfileUpdate(e) {
            e.preventDefault();
            const payload = {
                original_email: localStorage.getItem('userEmail'),
                current_password: document.getElementById('prof-password').value,
                name: document.getElementById('prof-name').value,
                age: parseInt(document.getElementById('prof-age').value),
                mobile: document.getElementById('prof-mobile').value,
                email: document.getElementById('prof-email').value
            };

            try {
                const response = await fetch(`${API_BASE_URL}/update_user`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert("Profile updated securely.");
                    localStorage.setItem('userEmail', data.new_email);
                    localStorage.setItem('userName', data.new_name);
                    
                    document.getElementById('prof-password').value = ""; 
                    showDashboard(); 
                } else {
                    alert("Verification Failed: " + data.detail);
                }
            } catch (error) {
                alert("Server connection failed.");
            }
        }

        function openChangePassword() {
            hideAllViews();
            document.getElementById('view-change-password').classList.remove('hidden');
            document.getElementById('view-change-password').classList.add('flex');
            
            // Clear fields when opened
            document.getElementById('change-current-pw').value = "";
            document.getElementById('change-new-pw').value = "";
            document.getElementById('change-confirm-pw').value = "";
        }

        async function handleChangePassword(e) {
            e.preventDefault();
            
            const currentPw = document.getElementById('change-current-pw').value;
            const newPw = document.getElementById('change-new-pw').value;
            const confirmPw = document.getElementById('change-confirm-pw').value;

            if (newPw.length < 6) {
                return alert("New password must be at least 6 characters long.");
            }
            if (newPw !== confirmPw) {
                return alert("The new passwords do not match. Please verify and try again.");
            }

            const payload = {
                email: localStorage.getItem('userEmail'),
                current_password: currentPw,
                new_password: newPw
            };

            try {
                const response = await fetch(`${API_BASE_URL}/change_password`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (response.ok) {
                    alert("Password updated successfully!");
                    showDashboard(); 
                } else {
                    alert("Update Failed: " + data.detail);
                }
            } catch (error) {
                alert("Server connection failed.");
            }
        }

        function logout() {
            localStorage.clear();
            location.reload(); 
        }

        window.addEventListener('load', () => {
            if (localStorage.getItem('userEmail')) showDashboard();
        });

        // ==========================================
        // DATABASE & WORKSPACE
        // ==========================================
        async function saveConversation() {
            const text = document.getElementById('translated-text').innerText;
            if (text === "Waiting for camera..." || text === "No hand detected" || text === "Sign not recognized...") return alert("No valid translation to save.");

            try {
                const response = await fetch(`${API_BASE_URL}/save_chat`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: localStorage.getItem('userEmail'), mode_used: "Sign-to-Text", transcript: text })
                });
                if (response.ok) loadHistory(); 
            } catch (error) {}
        }

        async function loadHistory() {
            const email = localStorage.getItem('userEmail');
            if (!email) return;
            try {
                const response = await fetch(`${API_BASE_URL}/history/${email}`);
                const data = await response.json();
                const historyList = document.getElementById('history-list');
                if (data.history && data.history.length > 0) {
                    historyList.innerHTML = data.history.map(item => `
                        <div class="bg-slate-50 p-3 rounded border border-slate-200 text-sm">
                            <p class="font-bold text-slate-800">${item.transcript}</p>
                            <p class="text-xs text-slate-400 mt-1">${item.timestamp}</p>
                        </div>
                    `).join('');
                } else {
                    historyList.innerHTML = `<p class="text-sm text-slate-500 italic">No saved conversations.</p>`;
                }
            } catch (error) {}
        }

        function switchMode(mode) {
            const st = document.getElementById('mode-sign-to-text'), ts = document.getElementById('mode-text-to-sign');
            const tabSt = document.getElementById('tab-sign-to-text'), tabTs = document.getElementById('tab-text-to-sign');

            if (mode === 'sign-to-text') {
                st.classList.remove('hidden'); st.classList.add('flex');
                ts.classList.add('hidden'); ts.classList.remove('flex');
                tabSt.className = "flex-1 px-4 py-3 rounded-lg font-bold transition-all flex items-center justify-center gap-2 tab-active";
                tabTs.className = "flex-1 px-4 py-3 rounded-lg font-bold transition-all flex items-center justify-center gap-2 tab-inactive hover:bg-slate-50";
            } else {
                ts.classList.remove('hidden'); ts.classList.add('flex');
                st.classList.add('hidden'); st.classList.remove('flex');
                tabTs.className = "flex-1 px-4 py-3 rounded-lg font-bold transition-all flex items-center justify-center gap-2 tab-active";
                tabSt.className = "flex-1 px-4 py-3 rounded-lg font-bold transition-all flex items-center justify-center gap-2 tab-inactive hover:bg-slate-50";
            }
        }

        // ==========================================
        // WEBSOCKET (CAMERA) LOGIC
        // ==========================================
        let ws;
        const videoElement = document.getElementById('webcam'), canvasOverlay = document.getElementById('overlay'), ctx = canvasOverlay.getContext('2d');
        const outputElement = document.getElementById('translated-text'), statusDot = document.getElementById('connection-dot'), statusText = document.getElementById('connection-status');
        let isProcessing = false, autoSpeakEnabled = false, lastSpokenText = "";

        const HAND_CONNECTIONS = [[0,1],[1,2],[2,3],[3,4],[0,5],[5,6],[6,7],[7,8],[5,9],[9,10],[10,11],[11,12],[9,13],[13,14],[14,15],[15,16],[13,17],[0,17],[17,18],[18,19],[19,20]];

        function connectWebSocket() {
            ws = new WebSocket(RENDER_URL);
            ws.onopen = () => { statusDot.classList.replace('bg-red-500', 'bg-teal-500'); statusText.innerText = "Connected"; outputElement.innerText = "Waiting for gesture..."; };
            ws.onmessage = (event) => {
                isProcessing = false; 
                const response = JSON.parse(event.data);
                const currentText = response.translation;
                outputElement.innerText = currentText;
                
                if (autoSpeakEnabled && currentText && currentText !== "No hand detected" && currentText !== "Sign not recognized...") {
                    if (currentText !== lastSpokenText) {
                        window.speechSynthesis.cancel(); 
                        window.speechSynthesis.speak(new SpeechSynthesisUtterance(currentText.replace(/([\u2700-\u27BF]|[\uE000-\uF8FF]|\uD83C[\uDC00-\uDFFF]|\uD83D[\uDC00-\uDFFF]|[\u2011-\u26FF]|\uD83E[\uDD10-\uDDFF])/g, '').trim()));
                        lastSpokenText = currentText;
                    }
                }
                if (currentText === "No hand detected") lastSpokenText = ""; 
                if (response.landmarks && response.landmarks.length > 0) drawLandmarks(response.landmarks);
                else ctx.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
            };
            ws.onclose = () => { statusDot.classList.replace('bg-teal-500', 'bg-red-500'); statusText.innerText = "Offline"; setTimeout(connectWebSocket, 3000); };
        }

        function drawLandmarks(landmarks) {
            canvasOverlay.width = videoElement.videoWidth; canvasOverlay.height = videoElement.videoHeight;
            ctx.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
            if (!landmarks || landmarks.length === 0) return;
            ctx.strokeStyle = '#0f172a'; ctx.lineWidth = 3;
            HAND_CONNECTIONS.forEach(connection => {
                const startPoint = landmarks[connection[0]], endPoint = landmarks[connection[1]];
                ctx.beginPath(); ctx.moveTo(startPoint.x * canvasOverlay.width, startPoint.y * canvasOverlay.height); ctx.lineTo(endPoint.x * canvasOverlay.width, endPoint.y * canvasOverlay.height); ctx.stroke();
            });
            ctx.fillStyle = '#0d9488'; 
            landmarks.forEach(point => { ctx.beginPath(); ctx.arc(point.x * canvasOverlay.width, point.y * canvasOverlay.height, 5, 0, 2 * Math.PI); ctx.fill(); });
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480, facingMode: "user" } });
                videoElement.srcObject = stream;
                videoElement.onloadedmetadata = () => {
                    canvasOverlay.width = videoElement.videoWidth; canvasOverlay.height = videoElement.videoHeight;
                    connectWebSocket(); 
                    setInterval(() => {
                        if (isProcessing) return;
                        if (ws && ws.readyState === WebSocket.OPEN && videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                            isProcessing = true; 
                            const hiddenCanvas = document.createElement("canvas");
                            hiddenCanvas.width = 320; hiddenCanvas.height = 240; 
                            hiddenCanvas.getContext("2d").drawImage(videoElement, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                            ws.send(hiddenCanvas.toDataURL("image/jpeg", 0.3));
                        }
                    }, 30);
                };
            } catch (err) { outputElement.innerText = "Camera access denied."; }
        }

        function toggleAutoSpeak() {
            autoSpeakEnabled = !autoSpeakEnabled;
            const text = document.getElementById('auto-speak-text');
            if (autoSpeakEnabled) { text.innerText = "🔊 Auto-Speak: ON"; window.speechSynthesis.speak(new SpeechSynthesisUtterance("")); } 
            else { text.innerText = "🔇 Auto-Speak: OFF"; window.speechSynthesis.cancel(); }
        }
    </script>
</body>
</html>
