<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Homo Sapiens - SIH 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#121212',
                        darkPanel: '#1E1E1E',
                        tealAccent: '#0D9488'
                    }
                }
            }
        }
    </script>
    <style>
        body { transition: background-color 0.3s, color 0.3s; }
    </style>
</head>
<body class="bg-gray-50 text-gray-900 dark:bg-darkBg dark:text-gray-100 min-h-screen flex flex-col">

    <!-- Navigation -->
    <nav class="p-4 bg-white dark:bg-darkPanel shadow-md flex justify-between items-center">
        <div class="font-bold text-xl tracking-wide">
            <span class="text-teal-600 dark:text-tealAccent">The Homo Sapiens</span> | SIH 2026
        </div>
        <button id="theme-toggle" class="p-2 rounded-full bg-gray-200 dark:bg-gray-700 hover:bg-gray-300 dark:hover:bg-gray-600 transition">
            🌓 Toggle Theme
        </button>
    </nav>

    <!-- Main Workspace -->
    <main class="flex-grow flex flex-col items-center p-6">
        
        <!-- Mode Toggle -->
        <div class="flex bg-gray-200 dark:bg-gray-800 rounded-full p-1 mb-8">
            <button id="btn-sign-to-text" class="px-6 py-2 rounded-full bg-white dark:bg-gray-700 shadow-sm font-semibold transition">Sign → Text</button>
            <button id="btn-text-to-sign" class="px-6 py-2 rounded-full text-gray-600 dark:text-gray-400 font-semibold transition">Text → Sign</button>
        </div>

        <!-- Mode 1: Sign to Text (Camera Feed) -->
        <div id="mode-sign-to-text" class="w-full max-w-4xl flex flex-col gap-6">
            <div class="relative bg-black rounded-xl overflow-hidden aspect-video shadow-lg border-2 border-transparent dark:border-gray-700">
                <video id="webcam" autoplay playsinline class="w-full h-full object-cover transform scale-x-[-1]"></video>
                 !-- Added z-10 to force it above the video -->
                <canvas id="overlay" class="absolute inset-0 w-full h-full z-10 transform scale-x-[-1] pointer-events-none object-cover"></canvas>

                <div class="absolute inset-0 border-4 border-teal-500/30 rounded-xl pointer-events-none"></div>
                <div class="absolute bottom-4 right-4 bg-red-600 text-white px-3 py-1 rounded-full text-sm font-bold animate-pulse">
                    LIVE
                </div>
            </div>
            
            <div class="bg-white dark:bg-darkPanel p-6 rounded-xl shadow-md flex justify-between items-center">
                <div class="flex-grow">
                    <h3 class="text-sm text-gray-500 dark:text-gray-400 font-bold uppercase tracking-wider mb-2">Translation Output</h3>
                    <p id="translated-text" class="text-2xl font-medium">Waiting for camera connection...</p>
                </div>
                <button class="ml-4 p-4 bg-teal-100 dark:bg-teal-900/30 text-teal-700 dark:text-tealAccent rounded-full hover:bg-teal-200 dark:hover:bg-teal-800/50 transition">
                    🔊
                </button>
            </div>
        </div>

        <!-- Mode 2: Text to Sign (Placeholder Avatar) -->
        <div id="mode-text-to-sign" class="w-full max-w-4xl hidden flex-col gap-6">
            <div class="bg-white dark:bg-darkPanel p-4 rounded-xl shadow-md flex items-center gap-4">
                <input type="text" placeholder="Type text to translate into sign language..." class="flex-grow bg-gray-100 dark:bg-gray-800 border-none rounded-lg p-4 text-lg focus:ring-2 focus:ring-tealAccent outline-none dark:text-white">
                <button class="bg-teal-600 hover:bg-teal-700 text-white p-4 rounded-lg font-bold transition">Translate</button>
            </div>
            
            <div class="bg-gray-200 dark:bg-gray-800 rounded-xl aspect-video flex items-center justify-center shadow-inner">
                <div class="text-center text-gray-500 dark:text-gray-400">
                    <span class="text-6xl block mb-4">🧍</span>
                    <p class="text-lg">3D Avatar / Video Generation Area</p>
                    <p class="text-sm">(To be implemented for SIH Finals)</p>
                </div>
            </div>
        </div>
    </main>

    <script>
        // --- Theme Toggling ---
        const themeToggle = document.getElementById('theme-toggle');
        const html = document.documentElement;
        
        if (localStorage.theme === 'dark' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        }

        themeToggle.addEventListener('click', () => {
            html.classList.toggle('dark');
            localStorage.theme = html.classList.contains('dark') ? 'dark' : 'light';
        });

        // --- View Switching ---
        const btnSignToText = document.getElementById('btn-sign-to-text');
        const btnTextToSign = document.getElementById('btn-text-to-sign');
        const modeSignToText = document.getElementById('mode-sign-to-text');
        const modeTextToSign = document.getElementById('mode-text-to-sign');

        btnSignToText.addEventListener('click', () => {
            modeSignToText.classList.remove('hidden');
            modeSignToText.classList.add('flex');
            modeTextToSign.classList.add('hidden');
            modeTextToSign.classList.remove('flex');
            
            btnSignToText.classList.replace('text-gray-600', 'bg-white');
            btnSignToText.classList.replace('dark:text-gray-400', 'dark:bg-gray-700');
            btnSignToText.classList.add('shadow-sm');
            
            btnTextToSign.classList.replace('bg-white', 'text-gray-600');
            btnTextToSign.classList.replace('dark:bg-gray-700', 'dark:text-gray-400');
            btnTextToSign.classList.remove('shadow-sm');
        });

        btnTextToSign.addEventListener('click', () => {
            modeTextToSign.classList.remove('hidden');
            modeTextToSign.classList.add('flex');
            modeSignToText.classList.add('hidden');
            modeSignToText.classList.remove('flex');
            
            btnTextToSign.classList.replace('text-gray-600', 'bg-white');
            btnTextToSign.classList.replace('dark:text-gray-400', 'dark:bg-gray-700');
            btnTextToSign.classList.add('shadow-sm');
            
            btnSignToText.classList.replace('bg-white', 'text-gray-600');
            btnSignToText.classList.replace('dark:bg-gray-700', 'dark:text-gray-400');
            btnSignToText.classList.remove('shadow-sm');
        });

        // --- WebSocket & Camera Logic ---
        const RENDER_URL = "wss://thehomosapiens-sih2026.onrender.com/ws/translate"; 
        
        let ws;
        const videoElement = document.getElementById('webcam');
        const outputElement = document.getElementById('translated-text');
        const canvasOverlay = document.getElementById('overlay');
        const ctx = canvasOverlay.getContext('2d');

        // The MediaPipe hand connections (which points connect to which)
        const HAND_CONNECTIONS = [
            [0,1], [1,2], [2,3], [3,4], // Thumb
            [0,5], [5,6], [6,7], [7,8], // Index finger
            [5,9], [9,10], [10,11], [11,12], // Middle finger
            [9,13], [13,14], [14,15], [15,16], // Ring finger
            [13,17], [0,17], [17,18], [18,19], [19,20] // Pinky & Palm
        ];

        function connectWebSocket() {
            ws = new WebSocket(RENDER_URL);
            
            ws.onopen = () => {
                console.log("Connected to Render backend");
                outputElement.innerText = "Backend connected! Waiting for hand gesture...";
            };

            ws.onmessage = (event) => {
    const response = JSON.parse(event.data);
    if (outputElement) {
        outputElement.innerText = response.translation;
    }
    
    // Debugging: This will print the points to your browser console (F12)
    // If this is undefined, your backend is not sending the landmarks!
    // console.log("Received landmarks:", response.landmarks);
    
    if (response.landmarks && response.landmarks.length > 0) {
        drawLandmarks(response.landmarks);
    } else {
        // Clear canvas if no hand is detected
        ctx.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
    }
};
            ws.onerror = (error) => {
                console.error("WebSocket Error:", error);
                outputElement.innerText = "Error connecting to backend.";
            };

            ws.onclose = () => {
                console.log("WebSocket connection closed. Reconnecting in 3 seconds...");
                setTimeout(connectWebSocket, 3000);
            };
        }

        function drawLandmarks(landmarks) {
            // Match canvas internal resolution to the actual video resolution
            canvasOverlay.width = videoElement.videoWidth;
            canvasOverlay.height = videoElement.videoHeight;
            
            // Clear the previous frame's drawings
            ctx.clearRect(0, 0, canvasOverlay.width, canvasOverlay.height);
            
            if (!landmarks || landmarks.length === 0) return;

            // Draw the connecting lines
            ctx.strokeStyle = '#0D9488'; // Teal color
            ctx.lineWidth = 3;
            HAND_CONNECTIONS.forEach(connection => {
                const startPoint = landmarks[connection[0]];
                const endPoint = landmarks[connection[1]];
                
                ctx.beginPath();
                ctx.moveTo(startPoint.x * canvasOverlay.width, startPoint.y * canvasOverlay.height);
                ctx.lineTo(endPoint.x * canvasOverlay.width, endPoint.y * canvasOverlay.height);
                ctx.stroke();
            });

            // Draw the 21 individual joints
            ctx.fillStyle = '#ef4444'; // Red color
            landmarks.forEach(point => {
                ctx.beginPath();
                ctx.arc(point.x * canvasOverlay.width, point.y * canvasOverlay.height, 5, 0, 2 * Math.PI);
                ctx.fill();
            });
        }

        async function startCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: 640, height: 480, facingMode: "user" } 
                });
                videoElement.srcObject = stream;
                
                // Wait for video to actually start playing before setting canvas size
                videoElement.onloadedmetadata = () => {
                    canvasOverlay.width = videoElement.videoWidth;
                    canvasOverlay.height = videoElement.videoHeight;
                    connectWebSocket();
                    startVideoStreaming();
                };
                
            } catch (err) {
                console.error("Camera access denied:", err);
                outputElement.innerText = "Camera access required to use the translator.";
            }
        }

        function startVideoStreaming() {
            const hiddenCanvas = document.createElement("canvas");
            const hiddenCtx = hiddenCanvas.getContext("2d");

            setInterval(() => {
                if (ws && ws.readyState === WebSocket.OPEN && videoElement.readyState === videoElement.HAVE_ENOUGH_DATA) {
                    hiddenCanvas.width = videoElement.videoWidth;
                    hiddenCanvas.height = videoElement.videoHeight;
                    hiddenCtx.drawImage(videoElement, 0, 0, hiddenCanvas.width, hiddenCanvas.height);
                    
                    const base64Frame = hiddenCanvas.toDataURL("image/jpeg", 0.5); 
                    ws.send(base64Frame);
                }
            }, 150);
        }

        window.addEventListener('load', startCamera);
    </script>
</body>
</html>
